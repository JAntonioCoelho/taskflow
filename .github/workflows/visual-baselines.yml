name: Update Visual Baselines

# Screenshot baselines are per platform: Playwright writes …-win32.png on
# Windows and …-linux.png in CI, and compares only against its own. The
# committed set is whatever the last person to run this generated.
#
# Run this once to create the Linux set so the E2E stage can compare instead
# of reporting every snapshot missing, and again whenever a deliberate design
# change makes the CI screenshots legitimately differ.
#
# It opens a pull request rather than pushing: new baselines are a change to
# what "correct" means, and that deserves a look at the images.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the baselines are changing'
        required: true
        default: 'Generate the Linux set'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Regenerate on Linux
    runs-on: ubuntu-latest
    # Same image as the E2E stage, so the output matches what that stage
    # will compare against. Keep the tag in step with package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Regenerate screenshots
        run: npx playwright test --update-snapshots
        env:
          CI: true

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          if git diff --quiet -- tests-visual; then
            echo "Baselines already match this platform — nothing to do."
            exit 0
          fi

          BRANCH="chore/visual-baselines-linux-${GITHUB_RUN_NUMBER}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests-visual
          git commit -m "chore: refresh visual baselines for linux

          $REASON

          Generated by the Update Visual Baselines workflow in
          mcr.microsoft.com/playwright:v1.63.0-noble, the same image the E2E
          stage runs in."
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: refresh visual baselines (linux)" \
            --body "$REASON

          These PNGs were generated in the same container the E2E stage uses, so
          they are what that stage will compare against.

          **Review the images themselves.** A baseline change says the new
          rendering is the correct one; if a screenshot here looks wrong, the
          code is what needs fixing, not the baseline." \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests-visual/**/*.png
          retention-days: 14
