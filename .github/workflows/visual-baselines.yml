name: Update Visual Baselines

# Screenshot baselines are per platform: Playwright writes …-win32.png on
# Windows and …-linux.png in CI, and compares only against its own. The
# committed set is whatever the last person to run this generated.
#
# Run this once to create the Linux set so the E2E stage can compare instead
# of reporting every snapshot missing, and again whenever a deliberate design
# change makes the CI screenshots legitimately differ.
#
# It opens a pull request rather than pushing: new baselines are a change to
# what "correct" means, and that deserves a look at the images.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the baselines are changing'
        required: true
        default: 'Generate the Linux set'

permissions:
  # Pushing the branch is all it does; the pull request is opened by hand.
  contents: write

jobs:
  update:
    name: Regenerate on Linux
    runs-on: ubuntu-latest
    # Same image as the E2E stage, so the output matches what that stage
    # will compare against. Keep the tag in step with package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Regenerate screenshots
        run: npx playwright test --update-snapshots
        env:
          CI: true

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          # --porcelain, not `git diff`: on the first run for a platform every
          # baseline is a new untracked file, which `git diff` does not see.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$(git status --porcelain -- tests-visual)" ]; then
            echo "Baselines already match this platform — nothing to do."
            exit 0
          fi

          BRANCH="chore/visual-baselines-linux-${GITHUB_RUN_NUMBER}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests-visual
          git commit -m "chore: refresh visual baselines for linux

          $REASON

          Generated by the Update Visual Baselines workflow in
          mcr.microsoft.com/playwright:v1.63.0-noble, the same image the E2E
          stage runs in."
          git push origin "$BRANCH"

          # The branch is pushed; opening the pull request is left to a click.
          # Actions cannot create one unless "Allow GitHub Actions to create
          # and approve pull requests" is enabled in the repository settings,
          # and requiring that setting to make the workflow usable is worse
          # than printing a link.
          COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${BRANCH}?expand=1"
          {
            echo "### Visual baselines regenerated"
            echo ""
            echo "$REASON"
            echo ""
            echo "Pushed to \`$BRANCH\`. **[Open the pull request]($COMPARE)**"
            echo ""
            echo "These PNGs come from the same container the E2E stage runs in,"
            echo "so they are what that stage will compare against."
            echo ""
            echo "Review the images themselves. A baseline change says the new"
            echo "rendering is the correct one — if a screenshot looks wrong, the"
            echo "code needs fixing, not the baseline."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Branch pushed. Open the PR: $COMPARE"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests-visual/**/*.png
          retention-days: 14
